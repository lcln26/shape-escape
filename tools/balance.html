<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Shape Escape balance check</title>
    <style>
        body { background: #111; color: #f2f2f2; font: 14px/1.5 monospace; padding: 16px; }
        table { border-collapse: collapse; }
        td, th { border: 1px solid #444; padding: 4px 10px; text-align: left; }
    </style>
</head>

<body>
    <h1>Balance check</h1>
    <p>Simulated players run against the real game rules over seeded runs, so tuning changes in
        <code>js/config.js</code> can be compared. Each player re-decides every 0.25s to mimic human reaction time.</p>
    <pre id="out">Running…</pre>
    <script type="module">
        // Simulated runs must not touch the real high score or achievements.
        Storage.prototype.setItem = () => {};
        Storage.prototype.getItem = () => null;

        const { Game } = await import('../js/game.js');
        const { MOVE_SPEED } = await import('../js/config.js');

        const RUNS = 30, MAX_TIME = 600, DT = 1 / 60, REACTION = 0.25;
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        let seed = 1;
        const realRandom = Math.random;
        const seeded = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

        const moveAwayFrom = (g, o) => { g.keys.left = o.x > g.player.x; g.keys.right = !g.keys.left; };
        // Shapes that would kill a player of `shape` and are about to land on it.
        const threats = (g, shape) => g.obstacles
            .filter(o => o.type === 'normal' && o.shape !== shape && o.y < g.player.y
                && g.player.y - o.y < 160 && Math.abs(o.x - g.player.x) < 60)
            .sort((a, b) => b.y - a.y);

        const players = {
            // Never changes shape; only steps away from shapes that would kill it.
            dodger(g) {
                g.keys.left = g.keys.right = false;
                const t = threats(g, g.player.shape);
                if (t.length) moveAwayFrom(g, t[0]);
            },
            // Goes for the soonest reachable shape, morphing to match it; dodges crudely.
            catcher(g) {
                const p = g.player, speed = g.getObstacleSpeed();
                g.keys.left = g.keys.right = false;
                const target = g.obstacles
                    .filter(o => o.y < p.y - 10)
                    .map(o => ({ o, t: (p.y - o.y) / speed }))
                    .filter(({ o, t }) => Math.abs(o.x - p.x) <= MOVE_SPEED * t * 0.8)
                    .sort((a, b) => a.t - b.t)[0];
                if (target) {
                    if (target.o.type === 'normal') p.shape = target.o.shape;
                    if (Math.abs(target.o.x - p.x) > 8) { g.keys.right = target.o.x > p.x; g.keys.left = !g.keys.right; }
                }
                const t = threats(g, p.shape);
                if (t.length) moveAwayFrom(g, t[0]);
            },
        };

        function run(policy, runSeed, { energyOnly = false } = {}) {
            seed = runSeed;
            Math.random = seeded;
            const g = new Game(canvas, ctx);
            g.state = 'playing';
            if (energyOnly) {
                // Ignore wrong-shape deaths to measure whether energy alone is sustainable.
                const endGame = g.endGame.bind(g);
                g.endGame = (reason) => { if (reason !== 'Wrong shape!') endGame(reason); };
            }
            let t = 0, nextDecision = 0;
            while (g.state === 'playing' && t < MAX_TIME) {
                if (t >= nextDecision) { policy(g); nextDecision = t + REACTION; }
                g.update(DT);
                t += DT;
            }
            Math.random = realRandom;
            return { t, reason: g.deathReason || 'still alive', score: g.score };
        }

        function summarize(name, policy, options) {
            const results = Array.from({ length: RUNS }, (_, i) => run(policy, i + 1, options));
            const times = results.map(r => r.t).sort((a, b) => a - b);
            const reasons = {};
            results.forEach(r => { reasons[r.reason] = (reasons[r.reason] || 0) + 1; });
            const scores = results.map(r => r.score).sort((a, b) => a - b);
            return `${name.padEnd(28)} median ${times[RUNS >> 1].toFixed(1).padStart(6)}s  best ${times[RUNS - 1].toFixed(1).padStart(6)}s  `
                + `median score ${String(scores[RUNS >> 1]).padStart(5)}  ends: ${JSON.stringify(reasons)}`;
        }

        document.getElementById('out').textContent = [
            summarize('dodger', players.dodger),
            summarize('catcher', players.catcher),
            summarize('catcher (energy only)', players.catcher, { energyOnly: true }),
        ].join('\n');
    </script>
</body>

</html>
